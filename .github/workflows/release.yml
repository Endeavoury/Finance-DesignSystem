name: Release Kanosis

on:
  push:
    branches:
      - main
      - release/minor
      - release/major
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: kanosis-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/endeavoury/kanosis-storybook

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@endeavoury'
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Install visual-test browser
        run: npx playwright install --with-deps chromium

      - name: Select semantic version increment
        id: increment
        env:
          MANUAL_INCREMENT: ${{ inputs.release_type }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            increment="$MANUAL_INCREMENT"
          else
            case "$GITHUB_REF_NAME" in
              main) increment=patch ;;
              release/minor) increment=minor ;;
              release/major) increment=major ;;
              *) echo "Unsupported release branch: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi
          echo "increment=$increment" >> "$GITHUB_OUTPUT"

      - name: Resolve synchronized release version
        id: version
        run: |
          version=$(npm run --silent release:version -- "${{ steps.increment.outputs.increment }}" --dry-run)
          tag="v$version"

          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            release_commit=$(git rev-list -n 1 "$tag")
            release_parent=$(git rev-parse "$release_commit^")
            if [[ "$release_parent" != "$GITHUB_SHA" ]]; then
              echo "Release tag $tag already belongs to a different source commit." >&2
              exit 1
            fi
            git checkout "$tag"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            npm run --silent release:version -- "${{ steps.increment.outputs.increment }}"
            npm install --package-lock-only --ignore-scripts
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run complete quality gate
        run: npm run check

      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures-${{ github.job }}
          path: test-results/
          if-no-files-found: ignore

      - name: Verify release version and package contents
        run: npm run release:verify -- "${{ steps.version.outputs.tag }}"

      - name: Commit and tag release version
        if: steps.version.outputs.existing == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json storybook/package.json examples/*/package.json
          git commit -m "chore(release): $RELEASE_TAG [skip release]"
          git tag -a "$RELEASE_TAG" -m "Kanosis $RELEASE_VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$RELEASE_TAG"

      - name: Pack npm release assets
        run: |
          mkdir -p release-assets
          npm pack --workspace @endeavoury/kanosis-tokens --pack-destination release-assets
          npm pack --workspace @endeavoury/kanosis-styles --pack-destination release-assets
          npm pack --workspace @endeavoury/kanosis --pack-destination release-assets
          npm pack --workspace @endeavoury/kanosis-react --pack-destination release-assets
          npm pack --workspace @endeavoury/kanosis-angular --pack-destination release-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Storybook image metadata
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kanosis Storybook
            org.opencontainers.image.description=Standalone Storybook for the Kanosis Web Component system

      - name: Build and publish Storybook image
        id: image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Storybook image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Export Storybook image release asset
        run: |
          docker pull "${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          docker save "${IMAGE_NAME}:${{ steps.version.outputs.version }}" \
            | gzip -9 > "release-assets/kanosis-storybook-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          printf '%s\n' '${{ steps.image.outputs.digest }}' \
            > "release-assets/kanosis-storybook-${{ steps.version.outputs.version }}.digest"

      - name: Generate release notes and manifest
        run: >-
          node scripts/create-release-notes.mjs
          "${{ steps.version.outputs.version }}"
          "$IMAGE_NAME"
          "${{ steps.image.outputs.digest }}"
          release-assets

      - name: Generate release checksums
        working-directory: release-assets
        run: >-
          sha256sum
          *.tgz
          *.tar.gz
          *.digest
          release-manifest.json
          > SHA256SUMS

      - name: Attest downloadable release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish npm packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:publish

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          assets=(
            release-assets/*.tgz
            release-assets/*.tar.gz
            release-assets/*.digest
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Kanosis ${{ steps.version.outputs.version }}" \
              --notes-file release-assets/release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Kanosis ${{ steps.version.outputs.version }}" \
              --notes-file release-assets/release-notes.md
          fi
