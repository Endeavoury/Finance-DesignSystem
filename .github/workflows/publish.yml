name: Publish design-system packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@finance-design'
          always-auth: true

      - name: Require publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FINANCE_DESIGN_PACKAGES_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "FINANCE_DESIGN_PACKAGES_TOKEN is required to publish @finance-design packages."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run check

      - name: Verify release metadata and package contents
        run: npm run release:verify -- "${{ github.event.release.tag_name }}"

      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FINANCE_DESIGN_PACKAGES_TOKEN }}
        run: |
          npm publish --workspace @finance-design/tokens
          npm publish --workspace @finance-design/styles
          npm publish --workspace @finance-design/design-system
          npm publish --workspace @finance-design/react
          npm publish --workspace @finance-design/angular
